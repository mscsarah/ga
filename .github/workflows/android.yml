# ============================================================
#  بناء تطبيق Android (APK + AAB) لمنصة «حكايات العراق»
#  يعمل على خوادم GitHub (تملك Android SDK كاملاً، بلا قيود شبكة).
#  التشغيل: تبويب Actions ← Build Android App ← Run workflow
#  ثم نزّل الناتج من قسم Artifacts.
# ============================================================
name: Build Android App

on:
  workflow_dispatch:
  push:
    branches: [ claude/lucid-babbage-4ky7kc, main ]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'mobile/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor deps
        working-directory: mobile
        run: npm install

      - name: Sync web assets into native project
        working-directory: mobile
        run: |
          cp ../index.html ../sw.js www/
          npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build release AAB (unsigned)
        working-directory: mobile/android
        run: ./gradlew bundleRelease --no-daemon
        continue-on-error: true

      - name: Collect outputs
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk out/hikayat-aliraq-debug.apk || true
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab out/hikayat-aliraq-release-unsigned.aab || true
          ls -la out

      - name: Upload APK (installable on phone)
        uses: actions/upload-artifact@v4
        with:
          name: hikayat-aliraq-APK
          path: out/hikayat-aliraq-debug.apk
          if-no-files-found: error

      - name: Upload AAB (for Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: hikayat-aliraq-AAB
          path: out/hikayat-aliraq-release-unsigned.aab
          if-no-files-found: warn
