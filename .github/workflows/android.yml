# ============================================================
#  بناء تطبيق Android (APK + AAB) لمنصة «حكايات العراق»
#  يعمل على خوادم GitHub (تملك Android SDK كاملاً، بلا قيود شبكة).
#  التشغيل: تبويب Actions ← Build Android App ← Run workflow
#  ثم نزّل الناتج من قسم Artifacts.
# ============================================================
name: Build Android App

on:
  workflow_dispatch:
  push:
    branches: [ claude/lucid-babbage-4ky7kc, main ]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'mobile/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor deps
        working-directory: mobile
        run: npm install

      - name: Sync web assets into native project
        working-directory: mobile
        run: |
          cp ../index.html ../sw.js www/
          npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build SIGNED release APK + AAB
        working-directory: mobile/android
        env:
          # عند ضبط هذه الأسرار في إعدادات المستودع تُستخدم بدل المفتاح المرفق (أكثر أماناً)
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Collect outputs
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk out/hikayat-aliraq-debug.apk || true
          cp mobile/android/app/build/outputs/apk/release/app-release.apk out/hikayat-aliraq-release-signed.apk || true
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab out/hikayat-aliraq-release-signed.aab || true
          ls -la out

      - name: Upload APK (installable on phone)
        uses: actions/upload-artifact@v4
        with:
          name: hikayat-aliraq-APK
          path: out/hikayat-aliraq-release-signed.apk
          if-no-files-found: error

      - name: Upload AAB (for Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: hikayat-aliraq-AAB
          path: out/hikayat-aliraq-release-signed.aab
          if-no-files-found: warn

      # نشر النتائج كـ GitHub Release → رابط مباشر قابل للتنزيل من الهاتف
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: حكايات العراق — Android (بناء ${{ github.run_number }})
          body: |
            تطبيق **حكايات العراق** لنظام Android — نسخة **موقّعة** جاهزة.
            - `hikayat-aliraq-release-signed.aab` ← ارفعه على **Google Play**.
            - `hikayat-aliraq-release-signed.apk` ← ثبّته مباشرة على الهاتف (فعّل «مصادر غير معروفة»).
            - `hikayat-aliraq-debug.apk` ← نسخة تجريبية للاختبار السريع.
          files: |
            out/hikayat-aliraq-release-signed.aab
            out/hikayat-aliraq-release-signed.apk
            out/hikayat-aliraq-debug.apk
